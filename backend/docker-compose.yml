services:
  app-node:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      AWS_ACCESS_KEY_ID: "DUMMYIDEXAMPLE"
      AWS_SECRET_ACCESS_KEY: "DUMMYEXAMPLEKEY"
      REGION: "ap-northeast-1"
      ENDPOINT: "http://dynamodb-local:8000"
    depends_on:
      dynamodb-local:
          condition: service_started
      dynamodb-setup:
          condition: service_completed_successfully
    container_name: app-node

  dynamodb-local:
    image: "amazon/dynamodb-local:latest"
    ports:
      - "8000:8000"
    container_name: dynamodb-local
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    volumes:
      - "./docker/dynamodb:/home/dynamodblocal/data"
    working_dir: /home/dynamodblocal

  dynamodb-setup:
      image: amazon/aws-cli
      depends_on:
        dynamodb-local:
          condition: service_started
      environment:
        AWS_ACCESS_KEY_ID: "DUMMYIDEXAMPLE"
        AWS_SECRET_ACCESS_KEY: "DUMMYEXAMPLEKEY"
        AWS_DEFAULT_REGION: "ap-northeast-1"
      entrypoint: ["/bin/sh", "-c"]
      command:
        - |
          until aws dynamodb list-tables --region ap-northeast-1 --endpoint-url http://dynamodb-local:8000; do
            echo 'dynamodb-localの起動待ち...'
            sleep 1
          done
          aws dynamodb --region ap-northeast-1 --endpoint-url http://dynamodb-local:8000 create-table --table-name local-mindlog-Diary-Table --attribute-definitions AttributeName=userId,AttributeType=S AttributeName=diaryId,AttributeType=S AttributeName=date,AttributeType=S --key-schema AttributeName=userId,KeyType=HASH AttributeName=diaryId,KeyType=RANGE --billing-mode PAY_PER_REQUEST --global-secondary-indexes 'IndexName=dateIndex,KeySchema=[{AttributeName=userId,KeyType=HASH},{AttributeName=date,KeyType=RANGE}],Projection={ProjectionType=ALL}'